[package]
name = "fail2ban-rs"
version = "0.4.0"
edition = "2024"
license = "GPL-2.0-or-later"
description = "sshd と Caddy (HTTP) のログを journal から読み、nftables で一時的にブロックする単一バイナリ (fail2ban の移植)"
readme = "README.md"

[dependencies]
fancy-regex = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
ipnet = "2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
